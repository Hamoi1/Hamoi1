name: Generate Animated Profile SVGs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.svg"
      - "output/**"

permissions:
  contents: write

concurrency:
  group: profile-svgs
  cancel-in-progress: false

jobs:
  build-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow

      - name: Generate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_svgs.py

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg info-card.svg hamoi1-ascii.svg
          git diff --cached --quiet || (git commit -m "chore: update animated profile SVGs [skip ci]" && git push)
